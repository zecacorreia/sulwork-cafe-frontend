<section class="w-full max-w-5xl mx-auto" [attr.aria-busy]="loading">
    <ng-container *ngIf="loading; else contentTpl">
        <div class="space-y-4" aria-live="polite">
            <div class="rounded-xl border border-gray-200 bg-white p-3 sm:p-4">
                <div class="flex items-center gap-2 mb-3 sm:mb-4">
                    <div class="h-5 w-5 rounded-full bg-zinc-200 animate-pulse"></div>
                    <div class="h-5 w-24 sm:w-32 bg-zinc-200 rounded animate-pulse"></div>
                </div>

                <div class="grid gap-3 sm:gap-4">
                    <div *ngFor="let _ of [1,2,3]" class="rounded-2xl border border-gray-200 bg-white p-4 sm:p-6">
                        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 sm:gap-4 mb-3 sm:mb-4">
                            <div class="flex items-center gap-3">
                                <div class="p-2 rounded-lg bg-zinc-100">
                                    <div class="h-5 w-5 bg-zinc-200 rounded animate-pulse"></div>
                                </div>
                                <div>
                                    <div class="h-4 w-32 sm:w-40 bg-zinc-200 rounded animate-pulse mb-2"></div>
                                    <div class="h-3 w-24 sm:w-28 bg-zinc-200 rounded animate-pulse"></div>
                                </div>
                            </div>
                            <div class="flex gap-2 self-start sm:self-auto">
                                <div class="h-8 w-8 rounded-xl bg-zinc-200 animate-pulse"></div>
                                <div class="h-8 w-8 rounded-xl bg-zinc-200 animate-pulse"></div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <div class="h-4 w-40 sm:w-56 bg-zinc-200 rounded animate-pulse"></div>
                            <div class="h-10 w-full bg-zinc-100 rounded animate-pulse"></div>
                            <div class="h-10 w-4/5 sm:w-5/6 bg-zinc-100 rounded animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-template #contentTpl>
        <div *ngIf="participants?.length === 0; else listTpl" class="max-w-xl">
            <div class="rounded-2xl bg-white border border-gray-200 shadow-sm p-6 sm:p-8 flex flex-col items-center gap-2 text-center">
                <lucide-icon name="calendar" class="w-10 h-10 sm:w-12 sm:h-12 text-zinc-400"></lucide-icon>
                <h3 class="font-semibold text-base sm:text-lg text-zinc-900">Nenhum café agendado</h3>
                <p class="text-sm sm:text-base text-zinc-600">
                    Adicione o primeiro participante para começar a organizar os cafés da manhã.
                </p>
            </div>
        </div>

        <ng-template #listTpl>
            <div class="border border-gray-200 rounded-xl overflow-hidden">
                <div class="flex items-center gap-2 p-3 sm:p-4 border-b border-gray-200">
                    <lucide-icon name="coffee" class="w-5 h-5 text-indigo-600 shrink-0"></lucide-icon>
                    <h3 class="font-semibold text-zinc-900 text-base sm:text-lg">Próximos Cafés</h3>
                </div>
                <ng-container *ngFor="let date of sortedDates; trackBy: trackDate">
                    <div class="space-y-4 animate-fade-in p-3 sm:p-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-2 pb-2 border-b border-gray-200">
                            <div class="flex items-center gap-2">
                                <ng-container [ngSwitch]="getDateStatus(date).icon">
                                <lucide-icon *ngSwitchCase="'clock'" name="clock" class="w-5 h-5" [ngClass]="getDateStatus(date).color"></lucide-icon>
                                <lucide-icon *ngSwitchCase="'x-circle'" name="x-circle" class="w-5 h-5" [ngClass]="getDateStatus(date).color"></lucide-icon>
                                <lucide-icon *ngSwitchDefault name="calendar" class="w-5 h-5" [ngClass]="getDateStatus(date).color"></lucide-icon>
                                </ng-container>
                                <h3 class="text-lg sm:text-xl font-semibold text-zinc-900 capitalize">{{ formatDate(date) }}</h3>
                            </div>
                            <span class="inline-block text-xs sm:text-sm px-2 py-0.5 sm:py-1 rounded-full font-semibold text-white w-max" [ngClass]="getDateStatusBg(date).color">
                                {{ getDateStatus(date).label }}
                            </span>
                        </div>

                        <div class="grid gap-4">
                            <div *ngFor="let participant of groupFor(date); trackBy: trackParticipant" class="rounded-2xl bg-white border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                                <div class="p-6">
                                    <div class="flex items-start justify-between mb-4">
                                        <div class="flex items-center gap-3">
                                            <div class="p-2 bg-indigo-50 rounded-lg">
                                                <lucide-icon name="user" class="w-5 h-5 text-indigo-600"></lucide-icon>
                                            </div>
                                            <div>
                                                <h4 class="font-semibold text-zinc-900">{{ participant.name }}</h4>
                                                <p class="text-sm text-zinc-600">CPF: {{ participant.cpf }}</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-2">
                                            <button type="button" (click)="onEdit(participant)" class="rounded-xl border px-3 py-2 hover:bg-zinc-100">
                                                <lucide-icon name="edit-3" class="w-4 h-4"></lucide-icon>
                                            </button>
                                            <button type="button" (click)="onDelete(participant.id, participant.name)" class="rounded-xl border px-3 py-2 hover:bg-red-50 text-red-600 border-red-200">
                                                <lucide-icon name="trash-2" class="w-4 h-4"></lucide-icon>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="space-y-3">
                                        <h5 class="font-medium text-zinc-900">Itens que trará:</h5>
                                        <div class="space-y-2">
                                            <div *ngFor="let item of participant.items; trackBy: trackItem"
                                                class="flex items-center gap-3 p-3 rounded-lg transition-colors"
                                                [ngClass]="isToday(date) ? 'bg-indigo-50 border border-indigo-200' : 'bg-zinc-100'">
                                                <input *ngIf="isToday(date)" type="checkbox" [checked]="item.brought"
                                                    (change)="onItemToggle(participant.id, item.id, $any($event.target).checked)"
                                                    class="size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                                                <span class="flex-1 text-sm sm:text-base"
                                                    [ngClass]="{
                                                        'line-through text-zinc-500' : isPast(date) && !item.brought,
                                                        'text-emerald-700 font-medium' : item.brought,
                                                        'text-zinc-900' : !item.brought && !isPast(date)
                                                    }">
                                                    {{ item.name }}
                                                </span>
                                                <lucide-icon *ngIf="item.brought" name="check-circle" class="w-4 h-4 text-emerald-600"></lucide-icon>
                                                <lucide-icon *ngIf="isPast(date) && !item.brought" name="x-circle" class="w-4 h-4 text-red-600"></lucide-icon>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </ng-template>
    </ng-template>
</section>
